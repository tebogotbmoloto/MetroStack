<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MetroStack - Quantum Edition</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="gameContainer">
    <aside id="sidebarLeft">
      <div class="title-stack">
        <span>QUANTUM</span>
        <span>STACK</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">RHYTHM FARES</span>
        <span class="stat-value" id="score">R 0</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">LEVEL</span>
        <span class="stat-value" id="level">1</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">ROUTES</span>
        <span class="stat-value" id="lines">0</span>
      </div>

      <div class="panel-placeholder" aria-hidden="true"></div>
    </aside>

    <div id="canvasWrapper">
      <canvas id="gameCanvas" width="300" height="600"></canvas>
      <div id="uiOverlay" class="visible"></div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
