<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020611">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MetroStack - SA Arcade Tetris</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="sidebarLeft">
            <div class="panel">
                <h2>METROSTACK</h2>
                <p class="subtitle">QUANTUM EDITION</p>
            </div>
            <div class="panel">
                <div class="statLabel">FARES EARNED</div>
                <div class="statValue" id="score">R 0</div>
            </div>
            <div class="panel">
                <div class="statLabel">ROUTE LEVEL</div>
                <div class="statValue" id="level">1</div>
            </div>
            <div class="panel">
                <div class="statLabel">TRIPS CLEARED</div>
                <div class="statValue" id="lines">0</div>
            </div>
        </div>

        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="uiOverlay"></div>
        </div>

        <!-- Touch Screen Control Pad for Mobile Phones -->
        <div id="touchControls" style="display: flex; gap: 8px; margin-top: 10px; justify-content: center; width: 100%;">
            <button id="btnLeft" class="menuBtn" style="flex: 1; padding: 14px 0; font-size: 18px;">◀</button>
            <button id="btnRotate" class="menuBtn" style="flex: 1; padding: 14px 0; font-size: 18px;">🔄</button>
            <button id="btnDrop" class="menuBtn" style="flex: 1; padding: 14px 0; font-size: 18px;">⬇</button>
            <button id="btnRight" class="menuBtn" style="flex: 1; padding: 14px 0; font-size: 18px;">▶</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
