<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroStack - SA Arcade Tetris</title>
    <style>
        body {
            background: #030712;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: #030712;
            padding: 10px;
            box-sizing: border-box;
        }

        #sidebarLeft {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            width: 100%;
            max-width: 320px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .panel {
            background: #111c34;
            border: 2px solid #22d3ee;
            padding: 6px 8px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            box-shadow: inset 0 0 6px rgba(34, 211, 238, 0.2);
        }

        .panel h2, .subtitle {
            display: none;
        }

        .statLabel {
            font-size: 8px;
            color: #67e8f9;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .statValue {
            font-size: 14px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 4px rgba(250, 204, 21, 0.4);
        }

        #canvasWrapper {
            position: relative;
            border: 3px solid #22d3ee;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.1);
        }

        canvas {
            display: block;
            background: #ffffff;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 290px;
            height: 580px;
            max-height: 65vh;
            object-fit: contain;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(3, 7, 18, 0.92);
            z-index: 10;
        }

        .revivedPanel {
            background: #111c34;
            border: 2px solid #22d3ee;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 260px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .menuBtn {
            background: linear-gradient(135deg, #22d3ee, #0284c7);
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
        }

        .secondaryBtn {
            background: linear-gradient(135deg, #db2777, #7c3aed);
            color: #ffffff;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
        }

        .reviveActions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .adBar {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #475569;
        }

        .adProgress {
            width: 100%;
            height: 100%;
            background: #22d3ee;
        }

        #touchControls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 290px;
            margin-top: 10px;
            gap: 6px;
        }

        #touchControls button {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #ffffff;
            border: 2px solid #ffffff;
            font-weight: bold;
            border-radius: 10px;
            flex: 1;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="sidebarLeft">
            <div class="panel">
                <span class="statLabel">FARES EARNED</span>
                <div class="statValue" id="score">R 0</div>
            </div>
            <div class="panel">
                <span class="statLabel">ROUTE LEVEL</span>
                <div class="statValue" id="level">1</div>
            </div>
            <div class="panel">
                <span class="statLabel">TRIPS CLEARED</span>
                <div class="statValue" id="lines">0</div>
            </div>
        </div>

        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="uiOverlay"></div>
        </div>

        <div id="touchControls">
            <button id="btnLeft">◀</button>
            <button id="btnRotate">🔄</button>
            <button id="btnDrop">⬇</button>
            <button id="btnRight">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const uiOverlay = document.getElementById("uiOverlay");
        const uiScore = document.getElementById("score");
        const uiLevel = document.getElementById("level");
        const uiLines = document.getElementById("lines");

        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;

        let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = true;
        let isPaused = false;
        let dropInterval = 500;
        let dropCounter = 0;
        let lastTime = 0;

        const SHAPES = [

            { name: "O", shape: [[1, 1], [1, 1]], color1: "#e0a96d", color2: "#bc6c25" },
            { name: "T", shape: [[0, 1, 0], [1, 1, 1]], color1: "#7209b7", color2: "#3a0ca3" },
            { name: "Z", shape: [[1, 1, 0], [0, 1, 1]], color1: "#d90429", color2: "#8d0801" },
            { name: "S", shape: [[0, 1, 1], [1, 1, 0]], color1: "#38b000", color2: "#007200" },
            { name: "L", shape: [[1, 0, 0], [1, 1, 1]], color1: "#4361ee", color2: "#3f37c9" },
            { name: "J", shape: [[0, 0, 1], [1, 1, 1]], color1: "#fb8500", color2: "#d45d00" },
            { name: "P", shape: [[1, 1, 1], [1, 0, 1]], color1: "#b5179e", color2: "#7209b7" },
            { name: "R", shape: [[1, 1], [1, 0], [1, 1]], color1: "#560bad", color2: "#3f37c9" }
        ];

        let player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            color1: "#00b4d8",
            color2: "#0077b6"
        };

        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtor ? new AudioCtor() : null;

        function ensureAudio() {
            if (!audioCtx) return;
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 0.08, type = "sine", volume = 0.04, slide = 0) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slide !== 0) {
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + duration);
            }

            gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playMoveSound() { ensureAudio(); playTone(220, 0.05, "square", 0.025, 45); }
        function playRotateSound() { ensureAudio(); playTone(330, 0.06, "triangle", 0.03, 80); }
        function playClearSound() {

            playTone(500, 0.12, "triangle", 0.035, 120);
            setTimeout(() => playTone(660, 0.1, "triangle", 0.035, 140),
