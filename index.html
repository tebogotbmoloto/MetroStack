<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroStack - SA Arcade Tetris</title>
    <style>
        body {
            background: #030712;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: #030712;
            padding: 10px;
            box-sizing: border-box;
        }

        #sidebarLeft {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            width: 100%;
            max-width: 320px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .panel {
            background: #111c34;
            border: 2px solid #22d3ee;
            padding: 6px 8px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            box-shadow: inset 0 0 6px rgba(34, 211, 238, 0.2);
        }

        .panel h2, .subtitle {
            display: none;
        }

        .statLabel {
            font-size: 8px;
            color: #67e8f9;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .statValue {
            font-size: 14px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 4px rgba(250, 204, 21, 0.4);
        }

        #canvasWrapper {
            position: relative;
            border: 3px solid #22d3ee;
            border-radius: 10px;
            overflow: hidden;
            background: #070b19;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        canvas {
            display: block;
            background: #070b19;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 290px;
            height: 580px;
            max-height: 65vh;
            object-fit: contain;
        }

        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(3, 7, 18, 0.92);
            z-index: 10;
        }

        .revivedPanel {
            background: #111c34;
            border: 2px solid #22d3ee;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 260px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .menuBtn {
            background: linear-gradient(135deg, #22d3ee, #0284c7);
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 211, 238, 0.3);
        }

        .secondaryBtn {
            background: linear-gradient(135deg, #db2777, #7c3aed);
            color: #ffffff;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
        }

        .reviveActions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .adBar {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #475569;
        }

        .adProgress {
            width: 100%;
            height: 100%;
            background: #22d3ee;
        }

        #touchControls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 290px;
            margin-top: 10px;
            gap: 6px;
        }

        #touchControls button {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #ffffff;
            border: 2px solid #ffffff;
            font-weight: bold;
            border-radius: 10px;
            flex: 1;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="sidebarLeft">
            <div class="panel">
                <span class="statLabel">FARES EARNED</span>
                <div class="statValue" id="score">R 0</div>
            </div>
            <div class="panel">
                <span class="statLabel">ROUTE LEVEL</span>
                <div class="statValue" id="level">1</div>
            </div>
            <div class="panel">
                <span class="statLabel">TRIPS CLEARED</span>
                <div class="statValue" id="lines">0</div>
            </div>
        </div>

        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="uiOverlay"></div>
        </div>

        <div id="touchControls">
            <button id="btnLeft">◀</button>
            <button id="btnRotate">🔄</button>
            <button id="btnDrop">⬇</button>
            <button id="btnRight">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const uiOverlay = document.getElementById("uiOverlay");
        const uiScore = document.getElementById("score");
        const uiLevel = document.getElementById("level");
        const uiLines = document.getElementById("lines");

        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;

        let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = true;
        let isPaused = false;
        let dropInterval = 500;
        let dropCounter = 0;
        let lastTime = 0;

        const SHAPES = [
            { name: "I", shape: [[1, 1, 1, 1]], color1: "#00F0FF", color2: "#0077FF" },
            { name: "O", shape: [[1, 1], [1, 1]], color1: "#FFEE00", color2: "#FF8800" },
            { name: "T", shape: [[0, 1, 0], [1, 1, 1]], color1: "#FF00FF", color2: "#8800FF" },
            { name: "Z", shape: [[1, 1, 0], [0, 1, 1]], color1: "#FF2244", color2: "#990011" },
            { name: "S", shape: [[0, 1, 1], [1, 1, 0]], color1: "#00FF66", color2: "#009933" },
            { name: "L", shape: [[1, 0, 0], [1, 1, 1]], color1: "#3399FF", color2: "#0033CC" },
            { name: "J", shape: [[0, 0, 1], [1, 1, 1]], color1: "#FF7700", color2: "#CC3300" },
            { name: "P", shape: [[1, 1, 1], [1, 0, 1]], color1: "#EE44FF", color2: "#7700AA" },
            { name: "R", shape: [[1, 1], [1, 0], [1, 1]], color1: "#AA44FF", color2: "#440099" }
        ];

        let player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            color1: "#00FFFF",
            color2: "#0077FF"
        };

        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtor ? new AudioCtor() : null;

        function ensureAudio() {
            if (!audioCtx) return;
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 0.08, type = "sine", volume = 0.04, slide = 0) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slide !== 0) {
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + duration);
            }

            gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playMoveSound() { ensureAudio(); playTone(220, 0.05, "square", 0.025, 45); }
        function playRotateSound() { ensureAudio(); playTone(330, 0.06, "triangle", 0.03, 80); }
        function playClearSound() {
            ensureAudio();
            playTone(500, 0.12, "triangle", 0.035, 120);
            setTimeout(() => playTone(660, 0.1, "triangle", 0.035, 140), 70);
        }
        function playGameOverSound() {
            ensureAudio();
            playTone(180, 0.18, "sawtooth", 0.05, -30);
            setTimeout(() => playTone(120, 0.22, "sawtooth", 0.05, -25), 120);
        }
        function playAdJingle() {
            ensureAudio();
            playTone(440, 0.1, "sine", 0.04, 100);
            setTimeout(() => playTone(554, 0.1, "sine", 0.04, 100), 100);
            setTimeout(() => playTone(659, 0.15, "sine", 0.04, 150), 200);
            setTimeout(() => playTone(880, 0.3, "sine", 0.05, 200), 350);
        }

        function resetBoard() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 500;
            dropCounter = 0;
            lastTime = 0;
            updateUI();
        }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (typeof showStartScreen === 'function') showStartScreen();
        });

        function startNewGame() {
            uiOverlay.innerHTML = "";
            isPaused = false;
            resetBoard();
            gameOver = false;
            spawnPiece();
        }

        function spawnPiece() {
            const rand = Math.floor(Math.random() * SHAPES.length);
            const nextShape = SHAPES[rand];

            player.matrix = nextShape.shape.map(row => row.slice());
            player.color1 = nextShape.color1;
            player.color2 = nextShape.color2;
            player.pos.y = 0;
            player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);

            if (checkCollision()) {
                gameOver = true;
                isPaused = false;
                player.matrix = null;
                playGameOverSound();
                showGameOverScreen();
            }
        }

        function checkCollision() {
            if (!player.matrix) return false;
            for (let r = 0; r < player.matrix.length; r++) {
                for (let c = 0; c < player.matrix[r].length; c++) {
                    if (player.matrix[r][c] === 0) continue;

                    const newX = player.pos.x + c;
                    const newY = player.pos.y + r;

                    if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if (newY >= 0 && grid[newY][newX] !== null) return true;
                }
            }
            return false;
        }

        function mergePiece() {
            if (!player.matrix) return;
            player.matrix.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) {
                        const x = player.pos.x + c;
                        const y = player.pos.y + r;

                        if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                            grid[y][x] = { color1: player.color1, color2: player.color2 };
                        }
                    }
                });
            });
        }

        function clearLines() {
            let rowCount = 0;

            for (let r = ROWS - 1; r >= 0; r--) {
                const fullRow = grid[r].every(cell => cell !== null);
                if (!fullRow) continue;

                grid.splice(r, 1);
                grid.unshift(Array(COLS).fill(null));
                rowCount++;
                r++;
            }

            if (rowCount > 0) {
                lines += rowCount;
                score += rowCount * 100 * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 500 - (level - 1) * 40);
                playClearSound();
                updateUI();
            }
        }

        function playerDrop() {
            if (gameOver || isPaused) return;
            player.pos.y += 1;

            if (checkCollision()) {
                player.pos.y -= 1;
                mergePiece();
                clearLines();
                if (!gameOver) {
                    spawnPiece();
                }
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (gameOver || isPaused) return;
            player.pos.x += dir;
            if (checkCollision()) {
                player.pos.x -= dir;
            } else {
                playMoveSound();
            }
        }

        function rotateMatrix(matrix) {
            const rows = matrix.length;
            const cols = matrix[0].length;
            const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    rotated[c][rows - 1 - r] = matrix[r][c];
                }
            }
            return rotated;
        }

        function playerRotate() {
            if (gameOver || isPaused || !player.matrix) return;
            const prevMatrix = player.matrix.map(row => row.slice());
            const prevX = player.pos.x;
            const rotated = rotateMatrix(player.matrix);

            player.matrix = rotated;
            let offset = 0;
            while (checkCollision()) {
                player.pos.x += 1;
                offset += 1;
                if (offset > 3) {
                    player.matrix = prevMatrix;
                    player.pos.x = prevX;
                    return;
                }
            }
            playRotateSound();
        }

        function drawBlock(x, y, color1, color2) {
            const px = x * BLOCK_SIZE;
            const py = y * BLOCK_SIZE;

            ctx.save();

            // 1. Bright white-to-color gradient fill so the inside is very bright
            const grad = ctx.createLinearGradient(px, py, px, py + BLOCK_SIZE);
            grad.addColorStop(0, '#ffffff'); // Crisp bright white top sheen
            grad.addColorStop(0.35, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(px, py, BLOCK_SIZE, BLOCK_SIZE);

            // 2. Neon drop-shadow glow
            ctx.shadowColor = color1;
            ctx.shadowBlur = 12;

            // 3. Bright white inner grid texture frame dots
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            for (let i = 5; i < BLOCK_SIZE - 5; i += 5) {
                for (let j = 5; j < BLOCK_SIZE - 5; j += 5) {
                    ctx.fillRect(px + i, py + j, 2, 2);
                }
            }

            // 4. Highlight bevel border
            ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(px + 2, py + BLOCK_SIZE - 2);
            ctx.lineTo(px + 2, py + 2);
            ctx.lineTo(px + BLOCK_SIZE - 2, py + 2);
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = "#070b19";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] !== null) {
                        drawBlock(c, r, grid[r][c].color1, grid[r][c].color2);
                    }
                }
            }

            if (!gameOver && player.matrix) {
                player.matrix.forEach((row, r) => {
                    row.forEach((value, c) => {
                        if (value !== 0) {
                            drawBlock(player.pos.x + c, player.pos.y + r, player.color1, player.color2);
                        }
                    });
                });
            }
        }

        function updateUI() {
            uiScore.textContent = `R ${score}`;
            uiLevel.textContent = String(level);
            uiLines.textContent = String(lines);
        }

        function showStartScreen() {
            let installBtnHTML = deferredPrompt ? `<button class="menuBtn secondaryBtn" id="installAppBtn" style="margin-top: 10px;">📱 INSTALL APP</button>` : '';

            uiOverlay.innerHTML = `
                <div class="revivedPanel">
                    <button class="menuBtn" id="startBtn">START STACKING</button>
                    ${installBtnHTML}
                </div>
            `;

            document.getElementById("startBtn").addEventListener("click", () => {
                ensureAudio();
                startNewGame();
            });

            const installAppBtn = document.getElementById("installAppBtn");
            if (installAppBtn) {
                installAppBtn.addEventListener("click", async () => {
                    if (!deferredPrompt) return;
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') deferredPrompt = null;
                    installAppBtn.style.display = 'none';
                });
            }
        }

        function togglePause() {
            if (gameOver) return;
            isPaused = !isPaused;

            if (isPaused) {
                uiOverlay.innerHTML = `
                    <div class="revivedPanel">
                        <h2 style="color: #00ffff; margin-bottom: 12px; font-size: 20px;">GAME PAUSED</h2>
                        <div class="reviveActions">
                            <button class="menuBtn" id="resumeBtn">RESUME</button>
                            <button class="menuBtn secondaryBtn" id="quitBtn">MAIN MENU</button>
                        </div>
                    </div>
                `;
                document.getElementById("resumeBtn").addEventListener("click", () => togglePause());
                document.getElementById("quitBtn").addEventListener("click", () => {
                    isPaused = false;
                    gameOver = true;
                    uiOverlay.innerHTML = "";
                    showStartScreen();
                });
            } else {
                uiOverlay.innerHTML = "";
                lastTime = performance.now();
            }
        }

        function showGameOverScreen() {
            uiOverlay.innerHTML = `
                <div class="revivedPanel">
                    <h2 style="color: #ff0055; margin-bottom: 12px; font-size: 20px;">ROUTE BLOCKED!</h2>
                    <div class="reviveActions">
                        <button class="menuBtn" id="reviveBtn">🎬 WATCH AD TO REVIVE</button>
                        <button class="menuBtn secondaryBtn" id="restartBtn">TRY AGAIN</button>
                    </div>
                </div>
            `;

            document.getElementById("reviveBtn").addEventListener("click", () => {
                ensureAudio();
                triggerAdRevive();
            });

            document.getElementById("restartBtn").addEventListener("click", () => {
                ensureAudio();
                startNewGame();
            });
        }

        function triggerAdRevive() {
            uiOverlay.innerHTML = `
                <div class="revivedPanel">
                    <h2 style="color: #00ffff; font-size: 16px; margin-bottom: 6px;">SPONSORED PARTNER AD</h2>
                    <p class="statLabel" style="margin-bottom: 12px;">Resetting board on Level ${level}...</p>
                    <div class="adBar">
                        <div class="adProgress" id="adProgress" style="transition: width 10s linear;"></div>
                    </div>
                    <div style="font-size: 28px; font-weight: bold; color: #ffff00; margin-top: 10px;" id="adTimer">10</div>
                </div>
            `;

            playAdJingle();
            setTimeout(() => {
                const bar = document.getElementById("adProgress");
                if (bar) bar.style.width = "0%";
            }, 50);

            let timeLeft = 10;
            const timerInterval = setInterval(() => {
                timeLeft--;
                const timerEl = document.getElementById("adTimer");
                if (timerEl) timerEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
                    uiOverlay.innerHTML = "";
                    gameOver = false;
                    isPaused = false;
                    dropCounter = 0;
                    spawnPiece();
                }
            }, 1000);
        }

        document.addEventListener("keydown", event => {
            if (event.code === "KeyP" || event.code === "Escape") {
                togglePause();
                return;
            }
            if (gameOver || isPaused) return;

            if (event.code === "ArrowLeft" || event.code === "KeyA") playerMove(-1);
            else if (event.code === "ArrowRight" || event.code === "KeyD") playerMove(1);
            else if (event.code === "ArrowDown" || event.code === "KeyS") playerDrop();
            else if (event.code === "ArrowUp" || event.code === "KeyW") playerRotate();
        });

        const btnLeft = document.getElementById("btnLeft");
        const btnRight = document.getElementById("btnRight");
        const btnRotate = document.getElementById("btnRotate");
        const btnDrop = document.getElementById("btnDrop");

        if (btnLeft) {
            btnLeft.addEventListener("touchstart", (e) => { e.preventDefault(); playerMove(-1); });
            btnLeft.addEventListener("click", () => playerMove(-1));
        }
        if (btnRight) {
            btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); playerMove(1); });
            btnRight.addEventListener("click", () => playerMove(1));
        }
        if (btnRotate) {
            btnRotate.addEventListener("touchstart", (e) => { e.preventDefault(); playerRotate(); });
            btnRotate.addEventListener("click", () => playerRotate());
        }
        if (btnDrop) {
            btnDrop.addEventListener("touchstart", (e) => { e.preventDefault(); playerDrop(); });
            btnDrop.addEventListener("click", () => playerDrop());
        }

        function gameLoop(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (!gameOver && !isPaused) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        showStartScreen();
        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
